# Is file ko repo me is path par rakhein:  .github/workflows/lead-finder.yml
# Secrets (Settings -> Secrets and variables -> Actions):
#   GOOGLE_SERVICE_ACCOUNT_JSON  = service account key ka poora JSON
#   GOOGLE_SHEET_ID              = sheet ka URL ya ID (sheet service account ko Editor share ho)

name: Shopify Lead Finder (hourly)

on:
  schedule:
    - cron: "17 * * * *"      # har ghante, 17 minute par
  workflow_dispatch:           # manual run button

concurrency:
  group: lead-finder           # pichli run chal rahi ho to naya run overlap nahi karega
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth dnspython

      - name: Run lead finder
        run: python shopify_lead_finder_v3.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          RUN_TIME_BUDGET_MINUTES: "45"
          NAMES_TARGET_PER_RUN: "2500"
