name: Hourly Lead Finder
on:
  schedule:
    - cron: '0 9 * * *'   # roz 1 baar chalega (9:00 AM UTC = 2:00 PM Pakistan time)
  workflow_dispatch:        # manual "Run workflow" button ke liye bhi allow karta hai
jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write Google token file
        run: echo '${{ secrets.TOKEN_JSON }}' > token.json
      - name: Run lead finder script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python lead_finder.py
