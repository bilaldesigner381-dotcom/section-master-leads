name: Hourly Email Sender
on:
  schedule:
    - cron: '0 * * * *'   # har ghante
  workflow_dispatch:       # manual "Run workflow" button

concurrency:
  group: email-sender      # do runs aik sath overlap na hon
  cancel-in-progress: false

jobs:
  send-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write Google token file
        run: echo '${{ secrets.TOKEN_JSON }}' > token.json
      - name: Run email sender script
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}      # NAYI lead-finder sheet
          SEND_MODE: ${{ vars.SEND_MODE || 'dry' }}            # 'dry' = test, 'live' = asli emails
          PHYSICAL_ADDRESS: ${{ vars.PHYSICAL_ADDRESS }}       # optional (footer)
          GMAIL_1_ADDRESS: ${{ secrets.GMAIL_1_ADDRESS }}
          GMAIL_1_APPPASS: ${{ secrets.GMAIL_1_APPPASS }}
          GMAIL_2_ADDRESS: ${{ secrets.GMAIL_2_ADDRESS }}
          GMAIL_2_APPPASS: ${{ secrets.GMAIL_2_APPPASS }}
          GMAIL_3_ADDRESS: ${{ secrets.GMAIL_3_ADDRESS }}
          GMAIL_3_APPPASS: ${{ secrets.GMAIL_3_APPPASS }}
          GMAIL_4_ADDRESS: ${{ secrets.GMAIL_4_ADDRESS }}
          GMAIL_4_APPPASS: ${{ secrets.GMAIL_4_APPPASS }}
          GMAIL_5_ADDRESS: ${{ secrets.GMAIL_5_ADDRESS }}
          GMAIL_5_APPPASS: ${{ secrets.GMAIL_5_APPPASS }}
          GMAIL_6_ADDRESS: ${{ secrets.GMAIL_6_ADDRESS }}
          GMAIL_6_APPPASS: ${{ secrets.GMAIL_6_APPPASS }}
        run: python email_sender.py
