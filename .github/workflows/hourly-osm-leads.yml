name: Hourly OSM Lead Finder
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  find-osm-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write Google token file
        run: echo '${{ secrets.TOKEN_JSON }}' > token.json
      - name: Run OSM lead finder script
        run: python lead_finder_osm.py
